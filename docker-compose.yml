services:
    app:
        build:
            context:
            dockerfile: Dockerfile
        container_name: tti_app
        restart: unless-stopped
        ports:
          - "8000:8000"
        volumes:
          - .:/var/www/html
        depends_on:
          - db
        environment:
          DB_HOST: db
          DB_PORT: 3306
          DB_DATABASE: tti_assessment
          DB_USERNAME: tti_user
          DB_PASSWORD: secret

    db:
      image: mysql:8.0
      container_name: tti_db
      restart: unless-stopped
      ports:
        - "3307:3306"
      environment:
        MYSQL_DATABASE: tti_assessment
        MYSQL_USER: tti_user
        MYSQL_PASSWORD: secret
        MYSQL_ROOT_PASSWORD: rootsecret
      volumes:
        - db_data:/var/lib/mysql

volumes:
  db_data: